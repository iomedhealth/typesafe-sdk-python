stages:
  - build-and-publish

variables:
  UV_PYTHON_PREFERENCE: "only-system"

publish-package:
  stage: build-and-publish
  tags:
    - production-gcp
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_BRANCH
      when: manual
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
      else
        UPSTREAM_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
        PACKAGE_VERSION="${UPSTREAM_VER}+iomed.g${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Building package version: ${PACKAGE_VERSION}"
      sed -i "s/^version = .*/version = \"${PACKAGE_VERSION}\"/" pyproject.toml
    - uv build --wheel --python python3
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      TWINE_USERNAME=gitlab-ci-token
      uv run --python python3 --with twine twine upload
      --verbose
      --repository-url https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/pypi
      dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

