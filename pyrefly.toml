preset = "strict"
project-includes = [
    "src",
    "tests",
]
# Negative fixtures are checked by pytest with --expectations.
project-excludes = ["tests/typing/negative"]
python-version = "3.10"
search-path = ["src", "."]
# `backports-zstd` only installs before Python 3.14, so it is missing from 3.14+ environments.
ignore-missing-imports = ["backports.zstd"]
